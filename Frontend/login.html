<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Elite Real Estate CRM</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container-fluid p-0">
        <div class="row g-0">
            
            <!-- Form Column (Left Side) -->
            <div class="col-lg-5 d-flex flex-column justify-content-center align-items-center bg-white form-column-wrapper">
                
                <!-- Mobile-Only Header -->
                <div class="mobile-header d-lg-none">
                    <div class="slideshow-container">
                        <!-- Images injected by script.js -->
                    </div>
                </div>
                
                <div class="form-container">
                    <div class="text-center mb-5">
                        <h1 class="fw-bold">Welcome Back</h1>
                        <p class="text-muted">Login to access your dashboard.</p>
                    </div>
                    
                    <form>
                        <div class="input-group mb-4">
                            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                            <input type="text" class="form-control" placeholder="Username" required>
                        </div>
                        <div class="input-group mb-4">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control" placeholder="Password" required>
                        </div>
                        <div class="d-grid mb-4">
                            <button type="submit" class="btn btn-primary fw-bold">LOGIN</button>
                        </div>
                        <div class="text-center">
                            <p class="mb-0">Don't have an account? <a href="register.html">Register Now</a></p>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Image Column (Right Side on Desktop) -->
            <div class="col-lg-7 d-none d-lg-block image-column">
                <div class="slideshow-container">
                    <!-- Images injected by script.js -->
                </div>
            </div>
            
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
